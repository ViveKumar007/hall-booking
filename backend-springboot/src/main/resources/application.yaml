# Hall Booking backend. Every value can be overridden with an environment variable
# (e.g. SERVER_PORT, CAMUNDA_CLIENT_GRPCADDRESS, APP_MODELSDIR) - the Docker setup does that.
server:
  port: 8090
  servlet:
    session:
      # The login lives in this cookie: not readable by scripts, not sent along with requests from other sites.
      cookie:
        http-only: true
        same-site: lax
      timeout: 8h

spring:
  application:
    name: hall-booking-backend
  # H2 in a file under backend-springboot/data, so bookings survive a restart. Profile "postgres" switches to PostgreSQL.
  datasource:
    url: jdbc:h2:file:./data/hallbooking;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # The React frontend's production build (frontend-react/dist, made by scripts/build-frontend.cmd). In Docker, nginx
  # serves it instead; during development "npm run dev" serves it on :5173 and forwards /api here.
  web:
    resources:
      static-locations: file:../frontend-react/dist/
      cache:
        period: 0
  # Sign in with Google (OpenID Connect). Client ID and secret come from secrets.cmd, never from this file.
  # Redirect URI registered at Google: http://localhost:8090/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, email, profile

# Camunda 8 Run 8.8 on this machine: no authentication.
camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080
    auth:
      method: none
    worker:
      defaults:
        # A job stays locked to this application for 30 s; if it crashes, Camunda hands the job out again after that.
        timeout: PT30S

logging:
  # Also written to a file (git-ignored), so a problem can be read after the window is closed.
  file:
    name: ./logs/hall-booking-backend.log

app:
  models-dir: ../hall-booking
  deploy-models: true
  # One-time import of the old json-server data when the register is still empty.
  import-file: ../hall-booking/mock/db.json
  # How long an approver has, and when the reminder goes out (ISO 8601: P1D = 1 day, PT1H = 1 hour). Sent with every
  # booking as approvalTimes. For demos and the automated tests: APPROVAL_TIMEOUT=PT2M, APPROVAL_REMINDER=PT1M.
  approval-timeout: ${APPROVAL_TIMEOUT:P1D}
  approval-reminder: ${APPROVAL_REMINDER:PT1H}
  smtp-host: ${SMTP_HOST:127.0.0.1}
  smtp-port: ${SMTP_PORT:1025}
  camunda-web-url: http://localhost:8080
  # Roles by Google account, "email=role+role;email=role" (from secrets.cmd). Everyone else is a requester.
  accounts: ${APP_ACCOUNTS:}
  # Key the REST connectors send as X-Register-Key; when empty, the register is open (only for local tests).
  register-key: ${REGISTER_API_KEY:}
  # Test-only login without Google (POST /api/auth/dev-login). Off unless APP_DEVLOGIN_ENABLED=true.
  dev-login-enabled: ${APP_DEVLOGIN_ENABLED:false}
  # Address of the app, for the links in the update emails.
  url: ${APP_URL:http://localhost:8090}
